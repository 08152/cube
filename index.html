
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CUBE WARS</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

/* STARTBILDSCHIRM */

#startScreen {
    position: fixed;
    inset: 0;

    background:
        url("hintergrund.png")
        center center / cover no-repeat;

    display: flex;
    justify-content: center;
    align-items: flex-end;

    padding-bottom: 9vh;
}

#startButton {
    width: 270px;
    height: 70px;

    background: #ffcf00;
    border: none;

    color: #111;
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 3px;

    cursor: pointer;

    transform: skew(-5deg);
    box-shadow: 0 5px 25px #0008;

    transition: .2s;
}

#startButton:hover {
    background: white;
    transform: skew(-5deg) scale(1.07);
}

#startButton:active {
    transform: skew(-5deg) scale(.96);
}

/* LADEBILDSCHIRM */

#loadingScreen {
    position: fixed;
    inset: 0;

    background: #111;

    display: none;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    color: white;
    gap: 18px;
}

#status {
    font-size: 17px;
    letter-spacing: 2px;
    text-align: center;
}

#elapsed {
    color: #ffcf00;
    font-size: 22px;
    font-weight: bold;
}

#progressContainer {
    width: min(450px, 80vw);
    height: 13px;

    background: #333;
    overflow: hidden;
}

#progressBar {
    width: 0%;
    height: 100%;

    background: #ffcf00;

    transition: width .3s;
}

/* SPIEL */

#gameFrame {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    border: none;
    display: none;

    background: #111;
}
</style>
</head>

<body>

<!-- STARTSEITE -->

<div id="startScreen">

    <button id="startButton" onclick="startGame()">
        START
    </button>

</div>

<!-- LADESEITE -->

<div id="loadingScreen">

    <div id="status">
        SERVER WIRD AUFGEWECKT ...
    </div>

    <div id="progressContainer">
        <div id="progressBar"></div>
    </div>

    <div id="elapsed">
        0 s
    </div>

</div>

<!-- SPIEL-IFRAME -->

<iframe
    id="gameFrame"
    title="CUBE WARS"
    allow="fullscreen"
    allowfullscreen>
</iframe>

<script>

/* SERVER */

const SERVER_URL = "https://cube-quor.onrender.com";
const GAME_URL = SERVER_URL + "/";

let started = false;
let startTime = 0;
let timeInterval = null;

/* WARTEZEIT */

function updateTime() {

    const seconds = Math.floor(
        (Date.now() - startTime) / 1000
    );

    document.getElementById("elapsed").textContent =
        seconds + " s";
}

/* SERVER PRÜFEN */

async function checkServer() {

    while (started) {

        try {

            const response = await fetch(
                SERVER_URL + "/",
                {
                    method: "GET",
                    cache: "no-store",
                    mode: "cors"
                }
            );

            if (response.ok) {

                document.getElementById("status").textContent =
                    "SERVER ONLINE";

                document.getElementById("progressBar").style.width =
                    "100%";

                loadLobby();

                return;
            }

        } catch (error) {

            // Server noch nicht erreichbar.
            // Status bleibt stabil.

        }

        await new Promise(resolve =>
            setTimeout(resolve, 5000)
        );
    }
}

/* LOBBY LADEN */

function loadLobby() {

    const frame = document.getElementById("gameFrame");

    document.getElementById("status").textContent =
        "LOBBY WIRD GELADEN ...";

    frame.onload = function() {

        document.getElementById("loadingScreen").style.display =
            "none";

        frame.style.display = "block";

        clearInterval(timeInterval);
    };

    frame.src = GAME_URL;
}

/* START */

function startGame() {

    if (started) return;

    started = true;
    startTime = Date.now();

    document.getElementById("startScreen").style.display =
        "none";

    document.getElementById("loadingScreen").style.display =
        "flex";

    document.getElementById("status").textContent =
        "SERVER WIRD AUFGEWECKT ...";

    timeInterval = setInterval(updateTime, 250);

    updateTime();

    checkServer();
}

</script>

</body>
</html>
