
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUBE WAR – Lobby</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #10131b;
    color: white;
    overflow: hidden;
}

button {
    font: inherit;
    cursor: pointer;
    border: none;
}

/* HINTERGRUND */

.background {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse at 65% 45%, #354d70 0%, transparent 45%),
        linear-gradient(125deg, #111827, #19283b 55%, #11151f);
    z-index: -2;
}

.background::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        90deg,
        rgba(9,13,21,.95) 0%,
        rgba(9,13,21,.72) 36%,
        rgba(9,13,21,.08) 75%,
        rgba(9,13,21,.45) 100%
    );
}

/* KOPFLEISTE */

.topbar {
    height: 82px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 38px;
    background: rgba(8,12,20,.83);
    border-bottom: 1px solid rgba(255,255,255,.1);
    position: relative;
    z-index: 5;
}

.logo {
    font-size: 29px;
    font-weight: 1000;
    letter-spacing: 2px;
}

.logo span {
    color: #ffb52e;
}

.top-center {
    display: flex;
    align-items: center;
    gap: 28px;
}

.top-info {
    color: #d2d8e3;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
}

.top-info strong {
    display: block;
    color: white;
    font-size: 17px;
    margin-top: 5px;
}

.currency {
    background: #202c40;
    padding: 12px 18px;
    border-radius: 8px;
    font-weight: bold;
    color: #ffcf5a;
}

.profile {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #202b3d;
    padding: 9px 15px;
    border-radius: 8px;
}

.profile-icon {
    width: 35px;
    height: 35px;
    background: #e9a52e;
    color: #171717;
    border-radius: 7px;
    display: grid;
    place-items: center;
    font-weight: 1000;
    font-size: 19px;
}

.profile-name {
    font-size: 13px;
    font-weight: bold;
}

.profile-level {
    color: #aab8ca;
    font-size: 11px;
    margin-top: 4px;
}

/* HAUPTLAYOUT */

.main {
    height: calc(100vh - 82px);
    display: grid;
    grid-template-columns: 245px minmax(0, 1fr);
}

/* LINKES MENÜ */

.sidebar {
    background: rgba(9,13,22,.86);
    border-right: 1px solid rgba(255,255,255,.08);
    padding: 28px 16px;
    display: flex;
    flex-direction: column;
    z-index: 3;
}

.menu-heading {
    color: #718097;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
    padding: 8px 13px 16px;
}

.menu-button {
    height: 55px;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 0 15px;
    margin-bottom: 7px;
    color: #c1cbd9;
    background: transparent;
    border-radius: 7px;
    text-align: left;
    font-weight: bold;
    font-size: 14px;
    transition: .15s;
}

.menu-button:hover {
    background: rgba(255,255,255,.08);
    color: white;
}

.menu-button.active {
    color: white;
    background: linear-gradient(90deg, #d98a1c, #f2b83f);
    box-shadow: 0 5px 18px rgba(231,157,37,.2);
}

.menu-icon {
    width: 25px;
    text-align: center;
    font-size: 20px;
}

.sidebar-bottom {
    margin-top: auto;
    padding: 15px 12px;
    border-top: 1px solid rgba(255,255,255,.1);
    color: #718097;
    font-size: 11px;
    line-height: 1.8;
}

/* SPIELERBEREICH */

.content {
    min-width: 0;
    position: relative;
    overflow: hidden;
}

.section-title {
    position: absolute;
    top: 34px;
    left: 42px;
    z-index: 2;
}

.section-title small {
    color: #ffbb40;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 3px;
}

.section-title h1 {
    font-size: clamp(28px, 4vw, 48px);
    font-weight: 1000;
    margin-top: 8px;
    letter-spacing: 1px;
}

.section-title p {
    margin-top: 9px;
    color: #b5c1d0;
    font-size: 14px;
}

/* 3D CHARAKTER */

.character-area {
    position: absolute;
    inset: 0;
}

#characterCanvas {
    width: 100%;
    height: 100%;
    display: block;
}

.character-label {
    position: absolute;
    bottom: 145px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    white-space: nowrap;
}

.character-label h2 {
    font-size: 22px;
    font-weight: 1000;
    letter-spacing: 3px;
    text-shadow: 0 3px 12px black;
}

.character-label p {
    color: #d4dce8;
    font-size: 12px;
    margin-top: 7px;
    letter-spacing: 2px;
}

/* RECHTE KARTE */

.player-card {
    position: absolute;
    right: 35px;
    top: 35px;
    width: 205px;
    padding: 17px;
    background: rgba(13,19,30,.75);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    z-index: 2;
}

.card-title {
    color: #ffbd45;
    font-size: 11px;
    letter-spacing: 2px;
    font-weight: bold;
    margin-bottom: 13px;
}

.card-status {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
    font-weight: bold;
}

.online-dot {
    width: 9px;
    height: 9px;
    background: #48df8b;
    border-radius: 50%;
    box-shadow: 0 0 10px #48df8b;
}

.card-description {
    color: #9caabd;
    font-size: 11px;
    line-height: 1.5;
    margin-top: 12px;
}

/* SPIELEN UNTEN */

.bottom-panel {
    position: absolute;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 4;
}

.play-button {
    min-width: 250px;
    height: 67px;
    padding: 0 35px;
    color: #18130a;
    background: linear-gradient(135deg, #ffd05b, #ee9b20);
    font-weight: 1000;
    font-size: 22px;
    letter-spacing: 2px;
    border-radius: 8px;
    box-shadow: 0 8px 25px rgba(230,153,31,.25);
    transition: .15s;
}

.play-button:hover {
    transform: translateY(-3px);
    filter: brightness(1.1);
}

.mode-button {
    height: 67px;
    min-width: 170px;
    padding: 0 20px;
    border-radius: 8px;
    background: rgba(22,32,48,.94);
    border: 1px solid rgba(255,255,255,.16);
    color: white;
    font-size: 13px;
    font-weight: bold;
}

.mode-button:hover {
    background: #293a53;
}

/* MELDUNG */

.message {
    position: absolute;
    bottom: 108px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffcf6a;
    font-size: 13px;
    font-weight: bold;
    z-index: 5;
    white-space: nowrap;
}

/* RESPONSIVE */

@media (max-width: 850px) {

    .main {
        grid-template-columns: 190px minmax(0, 1fr);
    }

    .sidebar {
        padding: 20px 10px;
    }

    .player-card {
        display: none;
    }

    .topbar {
        padding: 0 18px;
    }

    .top-center {
        gap: 10px;
    }

}

@media (max-width: 600px) {

    body {
        overflow: auto;
    }

    .topbar {
        height: 65px;
    }

    .logo {
        font-size: 20px;
    }

    .top-center {
        display: none;
    }

    .main {
        height: calc(100vh - 65px);
        display: flex;
        flex-direction: column;
    }

    .sidebar {
        flex-direction: row;
        overflow-x: auto;
        height: 66px;
        flex-shrink: 0;
        padding: 6px;
        border-right: none;
        border-bottom: 1px solid #333;
    }

    .menu-heading,
    .sidebar-bottom {
        display: none;
    }

    .menu-button {
        min-width: 105px;
        height: 48px;
        justify-content: center;
        padding: 5px;
        font-size: 11px;
        margin: 0 3px;
    }

    .menu-icon {
        display: none;
    }

    .content {
        flex: 1;
        min-height: 0;
    }

    .section-title {
        top: 20px;
        left: 20px;
    }

    .section-title h1 {
        font-size: 29px;
    }

    .character-label {
        bottom: 120px;
    }

    .bottom-panel {
        bottom: 20px;
        width: calc(100% - 30px);
        gap: 8px;
    }

    .play-button {
        flex: 1;
        min-width: 0;
        font-size: 17px;
        padding: 0 10px;
    }

    .mode-button {
        min-width: 110px;
        padding: 0 8px;
        font-size: 10px;
    }
}
</style>
</head>

<body>

<div class="background"></div>

<header class="topbar">

    <div class="logo">CUBE <span>WAR</span></div>

    <div class="top-center">

        <div class="top-info">
            SAISON
            <strong>01</strong>
        </div>

        <div class="top-info">
            LEVEL
            <strong>01</strong>
        </div>

        <div class="currency">◆ 0</div>

    </div>

    <div class="profile">
        <div class="profile-icon">C</div>
        <div>
            <div class="profile-name">PLAYER</div>
            <div class="profile-level">LEVEL 01</div>
        </div>
    </div>

</header>

<div class="main">

    <aside class="sidebar">

        <div class="menu-heading">HAUPTMENÜ</div>

        <button class="menu-button active" data-page="spielen">
            <span class="menu-icon">▶</span>
            SPIELEN
        </button>

        <button class="menu-button" data-page="modi">
            <span class="menu-icon">▦</span>
            SPIELMODI
        </button>

        <button class="menu-button" data-page="spind">
            <span class="menu-icon">◈</span>
            SPIND
        </button>

        <button class="menu-button" data-page="shop">
            <span class="menu-icon">◆</span>
            SHOP
        </button>

        <div class="sidebar-bottom">
            CUBE WAR<br>
            VERSION 0.1<br>
            ALPHA BUILD
        </div>

    </aside>

    <main class="content">

        <div class="section-title">
            <small>WILLKOMMEN BEI</small>
            <h1>CUBE WAR</h1>
            <p>Bereit für dein nächstes Gefecht?</p>
        </div>

        <div class="character-area">
            <canvas id="characterCanvas"></canvas>
        </div>

        <div class="character-label">
            <h2>DEIN CHARAKTER</h2>
            <p>STANDARD OUTFIT</p>
        </div>

        <div class="player-card">
            <div class="card-title">SPIELSTATUS</div>

            <div class="card-status">
                <span class="online-dot"></span>
                LOBBY BEREIT
            </div>

            <div class="card-description">
                Dein Charakter ist geladen.
                Du kannst die Lobby erkunden.
            </div>
        </div>

        <div class="message" id="message"></div>

        <div class="bottom-panel">

            <button class="play-button" id="playButton">
                SPIELEN
            </button>

            <button class="mode-button" id="modeButton">
                SOLO ▼
            </button>

        </div>

    </main>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { CubeWarCharacter } from "./character.js";

// SZENE
const scene = new THREE.Scene();

scene.background = null;

// KAMERA
const camera = new THREE.PerspectiveCamera(
    38,
    1,
    0.1,
    100
);

camera.position.set(0, 2.1, 8.5);
camera.lookAt(0, 1.75, 0);

// RENDERER
const canvas = document.getElementById("characterCanvas");

const renderer = new THREE.WebGLRenderer({
    canvas,
    alpha: true,
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;

// LICHT
const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x26334b,
    2.1
);

scene.add(ambient);

const mainLight = new THREE.DirectionalLight(
    0xffffff,
    3
);

mainLight.position.set(-4, 8, 6);
mainLight.castShadow = true;

scene.add(mainLight);

const rimLight = new THREE.DirectionalLight(
    0x579aff,
    2
);

rimLight.position.set(4, 4, -5);
scene.add(rimLight);

// BODEN
const floorGeometry = new THREE.CircleGeometry(2.5, 48);

const floorMaterial = new THREE.MeshStandardMaterial({
    color: 0x52647b,
    roughness: 0.85,
    metalness: 0.1
});

const floor = new THREE.Mesh(
    floorGeometry,
    floorMaterial
);

floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.02;
floor.receiveShadow = true;

scene.add(floor);

// BODENRING
const ring = new THREE.Mesh(
    new THREE.TorusGeometry(1.8, 0.025, 8, 64),
    new THREE.MeshBasicMaterial({
        color: 0xffb638
    })
);

ring.rotation.x = Math.PI / 2;
ring.position.y = 0.015;

scene.add(ring);

// CHARAKTER LADEN
try {

    const character = new CubeWarCharacter({
        jacketColor: "#344f70",
        pantsColor: "#343b49",
        skinColor: "#c99570",
        hairColor: "#30251f",
        accentColor: "#e39b35"
    });

    character.group.position.set(0, 0, 0);

    character.addToScene(scene);

    window.cubeWarCharacter = character;

} catch (error) {

    console.error("Charakter konnte nicht geladen werden:", error);

    document.getElementById("message").textContent =
        "CHARAKTER-FEHLER – character.js überprüfen";

}

// GRÖSSE ANPASSEN
function resize() {

    const width = canvas.clientWidth;
    const height = canvas.clientHeight;

    if (!width || !height) return;

    camera.aspect = width / height;
    camera.updateProjectionMatrix();

    renderer.setSize(width, height, false);

    renderer.render(scene, camera);
}

window.addEventListener("resize", resize);

resize();

// RENDERLOOP
renderer.setAnimationLoop(() => {
    renderer.render(scene, camera);
});

// MENÜ
const menuButtons = document.querySelectorAll(".menu-button");
const message = document.getElementById("message");

menuButtons.forEach(button => {

    button.addEventListener("click", () => {

        menuButtons.forEach(item => {
            item.classList.remove("active");
        });

        button.classList.add("active");

        const page = button.dataset.page;

        const titles = {
            spielen: ["CUBE WAR", "Bereit für dein nächstes Gefecht?"],
            modi: ["SPIELMODI", "Wähle deinen Spielmodus."],
            spind: ["DEIN SPIND", "Hier findest du deine Outfits."],
            shop: ["SHOP", "Entdecke deine Ausrüstung."]
        };

        document.querySelector(".section-title h1").textContent =
            titles[page][0];

        document.querySelector(".section-title p").textContent =
            titles[page][1];

        message.textContent =
            page === "spielen" ? "" : "DIESER BEREICH KOMMT BALD";

    });

});

// SPIELEN
document.getElementById("playButton").addEventListener("click", () => {

    message.textContent =
        "DIE SPIELMODI WERDEN NOCH ENTWICKELT";

});

// SPIELMODUS
document.getElementById("modeButton").addEventListener("click", () => {

    message.textContent =
        "SOLO – WEITERE MODI KOMMEN BALD";

});

</script>

</body>
</html>
